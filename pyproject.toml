[project]
name = "fep"
version = "0.1.0"
requires-python = ">=3.9"
description = "Free energy prediction with SOAP descriptors"
dependencies = [
    "ase>=3.26.0",
    "dscribe>=2.1.2",
    "numpy>=2.0.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["fep_utils"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-randomly>=4.0.1",
]
